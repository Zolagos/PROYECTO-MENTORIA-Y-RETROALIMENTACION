services:
  frontend:
    build:
      context: ./apps/frontend
      target: development
    container_name: tutorcode_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./apps/backend
      target: development
    container_name: tutorcode_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
    depends_on:
      - db
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  db:
    image: postgres:16
    container_name: tutorcode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_MAP}:${DB_PORT}"
    volumes:
      - tutorcode_pgdata:/var/lib/postgresql/data
      - ./apps/database/init:/docker-entrypoint-initdb.d

volumes:
  tutorcode_pgdata: