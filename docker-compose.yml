services:
  db:
    image: postgres:16
    container_name: tutorcode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutorcode
    ports:
      - "5432:5432"
    volumes:
      - tutorcode_pgdata:/var/lib/postgresql/data

volumes:
  tutorcode_pgdata: