<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutorLink</title>
    <!-- CSS global (orden importa: main → layout → components → páginas) -->
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
  </head>
  <body>

    <!-- ============================================================
         APP SHELL — Estructura principal SPA
         El router.js inyecta el contenido de cada página dentro
         de #page-content sin recargar la página.
    ============================================================ -->

    <!-- Overlay del sidebar para mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <div class="app-shell">

      <!-- ---- SIDEBAR ---- -->
      <aside id="sidebar" class="sidebar" aria-label="Menú de navegación">

        <!-- Logo -->
        <div class="sidebar__brand">
          <div class="sidebar__logo" aria-hidden="true">TL</div>
          <span class="sidebar__brand-name">TutorLink</span>
        </div>

        <!-- Info del usuario (se rellena con JS cuando hay sesión) -->
        <div class="sidebar__user" id="sidebar-user">
          <div class="sidebar__avatar" id="sidebar-avatar" aria-hidden="true">?</div>
          <div class="sidebar__user-info">
            <div class="sidebar__user-name" id="sidebar-user-name">Cargando...</div>
            <div class="sidebar__user-role" id="sidebar-user-role"></div>
          </div>
        </div>

        <!-- Navegación — se construye con JS según el rol del usuario -->
        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegación principal">
          <!-- Los items se inyectan dinámicamente por sidebar.js -->
        </nav>

        <!-- Botón colapsar -->
        <div class="sidebar__footer">
          <button class="sidebar__collapse-btn" id="sidebar-collapse-btn" aria-label="Colapsar menú" aria-expanded="true">
            <svg class="sidebar__collapse-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span class="sidebar__collapse-text">Colapsar</span>
          </button>
        </div>

      </aside>

      <!-- ---- MAIN WRAPPER ---- -->
      <div class="main-wrapper" id="main-wrapper">

        <!-- Header -->
        <header class="header" role="banner">
          <div class="header__left">
            <!-- Botón hamburguesa para mobile -->
            <button class="header__menu-btn" id="header-menu-btn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
              </svg>
            </button>
            <!-- Título de la página actual — lo actualiza el router -->
            <h1 class="header__page-title" id="header-page-title">Dashboard</h1>
          </div>

          <div class="header__right">
            <!-- Botón de notificaciones -->
            <button class="header__icon-btn" aria-label="Notificaciones" id="notifications-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <!-- Badge — se muestra si hay notificaciones -->
              <span class="header__badge hidden" id="notification-badge" aria-label="Tienes notificaciones"></span>
            </button>

            <!-- Avatar del usuario -->
            <div class="header__avatar" id="header-avatar" role="button" tabindex="0" aria-label="Menú de usuario" aria-haspopup="true">
              ?
            </div>
          </div>
        </header>

        <!-- ---- CONTENIDO DE LA PÁGINA ---- -->
        <!-- El router.js inyecta el HTML de cada vista aquí -->
        <main class="page-content" id="page-content" role="main" aria-live="polite">
          <!-- Cargando... placeholder inicial -->
          <div class="empty-state" id="loading-placeholder">
            <div class="skeleton skeleton--title" style="width:200px; margin:0 auto 16px;"></div>
            <div class="skeleton skeleton--text" style="width:300px; margin:0 auto 8px;"></div>
            <div class="skeleton skeleton--text" style="width:250px; margin:0 auto;"></div>
          </div>
        </main>

      </div><!-- /main-wrapper -->

    </div><!-- /app-shell -->

    <!-- ============================================================
         SCRIPTS — Orden importa
         1. router.js  → maneja la navegación
         2. sidebar.js → construye el sidebar según el rol
         3. header.js  → lógica del header
         4. app.js     → inicializa todo
    ============================================================ -->
    <script src="../js/router.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/app.js"></script>

  </body>
</html>
